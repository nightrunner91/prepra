server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 404.html существует только для error_page: напрямую его не отдаём.
    location = /404.html {
        internal;
    }

    # Хешированные бандлы Astro можно кэшировать навсегда.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Иконки и картинки из public: имена стабильные, поэтому кэш короче.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Страницы Astro — это директории с index.html. Отдаём и /path, и /path/,
    # для несуществующих путей — 404.html с кодом 404.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 404 /404.html;
}
